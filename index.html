<header><div class="brand"><span class="logo">♧</span> 단어숲</div><nav class="nav" aria-label="주 메뉴"><button class="active" data-page="study">✦ 오늘의 학습</button><button data-page="words">▤ 내 단어장</button><button data-page="import">＋ 단어 추가</button></nav><span class="header-note">하루 한 뼘, 자라는 영어</span></header>
<main class="shell"><div class="intro"><div><div class="eyebrow">GROW A LITTLE, EVERY DAY</div><h1 id="page-title">오늘도 단어숲에 왔구나!</h1><p id="page-description">하루 5개면 충분해. 작은 단어부터 함께 키워 보자.</p></div><span class="date" id="date"></span></div><div class="layout"><section class="panel" id="content" aria-label="학습 공간"></section><aside class="side"><section class="panel"><div class="row"><h2>오늘의 작은 목표</h2><span>☀</span></div><div class="goal-number"><span id="today-count">0</span> <small>/ 5개</small></div><div class="progress" style="margin:12px 0"><i id="goal-bar"></i></div><p style="font-size:12px" id="goal-message">작은 시작이 큰 숲이 될 거야.</p><div class="seed-art" aria-hidden="true"><span class="soil"></span><span class="stem"></span><span class="leaf"></span><span class="leaf right"></span></div></section><section class="panel"><h2>나의 단어숲</h2><div class="stat row"><span>🌱 전체 단어</span><b id="total-count"></b></div><div class="stat row"><span>🌿 외운 단어</span><b id="known-count"></b></div><div class="stat row"><span>🍂 복습할 단어</span><b id="review-count"></b></div></section><section class="panel small-card"><h2>💡 소리 내어 말해 봐!</h2><p>단어를 듣고 세 번 따라 말해 보자.<br>눈과 귀, 입으로 익히면 더 잘 기억나.</p></section></aside></div><footer>조금씩, 꾸준히. 나만의 단어숲을 키워요.</footer></main><div id="toast" role="status" aria-live="polite"></div>
<script>const SAMPLE=[{word:'adventure',meaning:'모험',example:'Let’s go on an adventure.',translation:'우리 모험을 떠나자.',category:'일상'},{word:'brave',meaning:'용감한',example:'You are very brave.',translation:'너는 정말 용감해.',category:'마음'},{word:'forest',meaning:'숲',example:'We walk in the forest.',translation:'우리는 숲에서 걸어.',category:'자연'},{word:'promise',meaning:'약속',example:'I keep my promise.',translation:'나는 내 약속을 지켜.',category:'일상'},{word:'wonderful',meaning:'멋진',example:'Have a wonderful day!',translation:'멋진 하루 보내!',category:'마음'},{word:'garden',meaning:'정원',example:'Flowers grow in the garden.',translation:'정원에 꽃이 자라.',category:'자연'},{word:'together',meaning:'함께',example:'We play together.',translation:'우리는 함께 놀아.',category:'일상'},{word:'curious',meaning:'궁금해하는',example:'I am curious about space.',translation:'나는 우주가 궁금해.',category:'마음'},{word:'gentle',meaning:'다정한',example:'She is gentle with animals.',translation:'그녀는 동물들에게 다정해.',category:'마음'},{word:'discover',meaning:'발견하다',example:'We discover a new place.',translation:'우리는 새로운 장소를 발견해.',category:'일상'}];
</script><script>'use strict';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=w=>w.word.trim().toLowerCase(), own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k), clone=x=>JSON.parse(JSON.stringify(x));
const dk=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const norm=s=>String(s).normalize('NFKC').toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ').trim();
const KEY='wordforest-v2';
function validate(input){
 if(!Array.isArray(input)||input.length>5000)throw Error('단어 배열 [ … ]을 넣어 주세요. 최대 5,000개예요.');
 return input.map((w,i)=>{
  if(!w||typeof w!=='object')throw Error((i+1)+'번째 단어 형식을 확인해 주세요.');
  const out={};
  for(const [k,alias] of Object.entries({word:'en',meaning:'ko',type:'type',example:'example',translation:'example_ko',category:'category'})){
   const v=w[k]??w[alias]??'';
   if(typeof v!=='string'||v.length>2000)throw Error((i+1)+'번째 '+k+' 값은 2,000자 이하 문자열이어야 해요.');
   out[k]=v.trim();
  }
  if(!out.word||!out.meaning)throw Error((i+1)+'번째 영어(word/en)와 뜻(meaning/ko)이 필요해요.');
  out.category||='기타';return out;
 });
}
const freshRec=()=>({level:0,due:0,known:false,important:false,correct:0,wrong:0,difficult:false});
const fresh=()=>({version:2,words:validate(SAMPLE),records:{},days:{},xp:0,combo:0,bestCombo:0,perfect:0,badges:[],tts:true});
function normalizeState(raw){
 if(!raw||typeof raw!=='object')throw Error('백업 형식이 맞지 않아요.');
 const s=fresh();s.words=validate(raw.words);
 for(const w of s.words){

const JSON_SAMPLE=[{en:'brave',type:'adjective',ko:'용감한',example:'You are very brave.',example_ko:'너는 정말 용감해.',category:'마음'},{en:'forest',type:'noun',ko:'숲',example:'We walk in the forest.',example_ko:'우리는 숲에서 걸어.',category:'자연'}];

function renderImport(){
 const desc={json:'word/meaning 형식과 참고 앱의 en/ko 형식을 모두 읽어요.',tsv:'영어 → 뜻 → 예문 → 번역 → 품사 → 주제 순서로 탭을 구분해 붙여넣으세요. 앞의 2칸은 필수예요.',reset:'학습 기록을 초기화할 영어 단어를 한 줄에 하나씩 적어 주세요. 단어와 중요 표시는 유지돼요.'};

 $('#import-input').oninput=e=>draft=e.target.value;
 $('#file-input').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)throw Error('파일은 5MB까지 읽을 수 있어요.');draft=await f.text();if(inputMode!=='reset')inputMode=f.name.endsWith('.json')?'json':'tsv';importMessage='파일을 읽었어요. 확인 후 추가 버튼을 눌러 주세요.';renderImport();}catch(e){showImport(e.message);}};
 $('#restore-input').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024)throw Error('백업 파일은 10MB까지 지원해요.');const raw=JSON.parse((await f.text()).replace(/^\uFEFF/,''));if(raw.app!=='wordforest'||raw.version!==2)throw Error('단어숲 전체 백업 파일이 아니에요.');const restored=normalizeState(raw.data);confirmAction('백업 복원',restored.words.length+'개 단어와 학습 기록으로 바꿀까요? 현재 자료는 되돌리기로 복구할 수 있어요.',()=>{checkpoint();state=restored;session=null;save();render();toast('전체 백업을 복원했어요.');});}catch(e){showImport(e instanceof SyntaxError?'올바른 JSON 백업을 선택해 주세요.':e.message);}};
}
function showImport(t){importMessage=t;const target=$('#import-status');if(target){target.hidden=false;target.textContent=t;}}
function parseTSV(text){return validate(text.trim().split(/\r?\n/).filter(x=>x.trim()).map(line=>{const [word,meaning,example='',translation='',type='',category='']=line.split('\t');return {word,meaning,example,translation,type,category};}));}
function checkpoint(){undoData=clone(state);$('#undo-strip').hidden=false;}
function mergeWords(words){
 if(!words.length)throw Error('추가할 단어가 없어요.');
 const map=new Map(state.words.map(w=>[id(w),w])),incoming=new Map(words.map(w=>[id(w),w]));
 if(new Set([...map.keys(),...incoming.keys()]).size>5000)throw Error('단어장은 최대 5,000개까지 저장할 수 있어요.');
 checkpoint();let added=0,updated=0;
 for(const [k,w] of incoming){if(map.has(k)){updated++;const old=map.get(k);if(old.meaning!==w.meaning||old.example!==w.example||old.translation!==w.translation){const r=freshRec();r.important=rec(old).important;setRec(w,r);}}else added++;map.set(k,w);}
 state.words=[...map.values()];save();updateChrome();return added+'개 추가, '+updated+'개 업데이트했어요.';
}
function doImport(){
 try{
  if(inputMode==='reset'){const keys=new Set(draft.split(/\r?\n/).map(x=>x.trim().toLowerCase()).filter(Boolean)),words=state.words.filter(w=>keys.has(id(w)));if(!words.length)throw Error('일치하는 영어 단어가 없어요.');
   confirmAction('선택 단어 초기화',words.length+'개 단어의 암기·퀴즈 기록을 초기화할까요?',()=>{checkpoint();for(const w of words){const r=freshRec();r.important=rec(w).important;setRec(w,r);}save();updateChrome();showImport(words.length+'개 단어의 기록을 초기화했어요.');});return;
  }showImport(mergeWords(inputMode==='json'?validate(JSON.parse(draft.replace(/^\uFEFF/,''))):parseTSV(draft)));
 }catch(e){showImport(e instanceof SyntaxError?'JSON 형식이 맞지 않아요. 큰따옴표·쉼표·대괄호를 확인해 주세요.':e.message);}
}

function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('복사했어요! 원하는 곳에 붙여넣어 주세요.');}catch{openModal('복사할 내용','<p>아래 내용을 길게 눌러 복사하거나 Ctrl+C를 눌러 주세요.</p><textarea id="copy-fallback" class="field" readonly>'+esc(text)+'</textarea>');$('#copy-fallback').select();}}
function speak(text){if(!state.tts){toast('위쪽의 소리를 먼저 켜 주세요.');return;}if(!('speechSynthesis'in window)){toast('이 브라우저는 발음을 지원하지 않아요.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.8;u.onerror=()=>toast('발음을 재생하지 못했어요. 기기의 영어 음성을 확인해 주세요.');speechSynthesis.speak(u);}

function onAction(action,b){
 const i=Number(b.dataset.index),w=state.words[i];if(action.startsWith('nav-'))return go(action.slice(4));
 switch(action){
 case 'tts':state.tts=!state.tts;if(!state.tts&&'speechSynthesis'in window)speechSynthesis.cancel();save();updateChrome();if(session&&!session.finished)renderSession();break;
 case 'review':cardSettings.range='review';go('cards');break;
 case 'wrong-quiz':settings.range='wrong';go('quiz');break;
 case 'badges':showBadges();break;
 case 'close-modal':$('#dialog').close();modalCallback=null;break;
 case 'confirm':{const cb=modalCallback;modalCallback=null;$('#dialog').close();cb?.();break;}
 case 'start-cards':start('cards');break;
 case 'start-quiz':start('quiz');break;
 case 'flip':session.revealed=!session.revealed;renderSession();break;
 case 'speak-word':speak(session.words[session.index].word);break;
 case 'show-example':{const word=session.words[session.index];openModal('예문','<p>'+esc(word.example)+'</p><p>'+esc(word.translation)+'</p>'+btn('speak-example','🔊 예문 듣기','btn'));break;}
 case 'speak-example':speak(session.words[session.index].example);break;
 case 'star':{const word=session.words[session.index];setRec(word,{...rec(word),important:!rec(word).important});save();renderSession();break;}
 case 'card-again':case 'card-know':if(!session.revealed)return;{const word=session.words[session.index],ok=action==='card-know';activity(word,ok);session.answers.push({word:id(word),ok});next();break;}
 case 'choice':if(session.answered)return;session.question.input=String(i);submitAnswer();break;
 case 'submit':submitAnswer();break;
 case 'skip':submitAnswer(true);break;
 case 'pick':if(session.answered||session.question.picked.includes(i))return;session.question.picked.push(i);renderSession();break;
 case 'unpick':if(session.answered)return;session.question.picked.splice(i,1);renderSession();break;
 case 'hint':{const q=session.question,word=session.words[session.index];toast(q.type==='sentence'?'첫 단어: '+tokens(word)[0]:'첫 글자: '+(q.type==='fill'?word.word:q.target).slice(0,1));break;}
 case 'next':if(session.answered)next();break;
 case 'quit':confirmAction('학습 그만하기','지금까지 공부한 기록은 저장돼요. 설정 화면으로 돌아갈까요?',()=>{session=null;render();});break;
 case 'restart':session=null;render();break;
 case 'word-known':{const r={...rec(w)},known=!r.known;r.known=known;r.level=known?Math.max(2,r.level):0;r.due=known?Date.now()+3*86400000:0;r.difficult=false;setRec(w,r);unlock();save();updateChrome();drawWords();break;}
 case 'word-star':setRec(w,{...rec(w),important:!rec(w).important});save();drawWords();break;
 case 'word-speak':speak(w.word);break;
 case 'word-delete':confirmAction('단어 삭제',w.word+' 단어를 삭제할까요? 되돌리기로 복구할 수 있어요.',()=>{checkpoint();state.words=state.words.filter(x=>id(x)!==id(w));delete state.records[id(w)];save();render();});break;
 case 'delete-all':confirmAction('전체 단어 삭제',state.words.length+'개 단어와 단어별 기록을 삭제해요. 삭제 후에도 기본 단어 추가와 JSON 가져오기를 사용할 수 있어요.',()=>{checkpoint();state.words=[];state.records={};session=null;save();render();});break;
 case 'reset-memory':resetMemory();break;
 case 'reset-quiz':resetQuiz();break;
 case 'input-mode':inputMode=b.dataset.mode;importMessage='';renderImport();break;
 case 'clear-input':draft='';renderImport();break;
 case 'copy-sample':copy(inputMode==='tsv'?TSV_SAMPLE:inputMode==='reset'?'brave\nforest':JSON.stringify(JSON_SAMPLE,null,2));break;
 case 'sample-file':download(JSON_SAMPLE,'words-sample.json');break;
 case 'copy-prompt':copy('초등학교 5학년용 영어 단어 20개를 만들어 줘. 쉬운 한국어 뜻, 품사, 짧은 영어 예문, 한국어 번역, 주제를 포함해 줘. 빈칸 퀴즈를 위해 en 단어를 예문에 같은 철자로 반드시 포함하고, 문장 퀴즈를 위해 2단어 이상의 자연스러운 예문을 만들어 줘. 아래 형식의 유효한 JSON 배열만 출력해 줘.\n'+JSON.stringify(JSON_SAMPLE,null,2));break;
 case 'file':$('#file-input').click();break;
 case 'restore':$('#restore-input').click();break;
 case 'import':doImport();break;
 case 'builtin':try{showImport(mergeWords(validate(SAMPLE)));}catch(e){showImport(e.message);}break;

 case 'undo':if(undoData){state=undoData;undoData=null;session=null;$('#undo-strip').hidden=true;save();render();toast('마지막 변경을 되돌렸어요.');}break;
 }

document.addEventListener('change',e=>{if(e.target.dataset.setting){const cfg=e.target.dataset.kind==='cards'?cardSettings:settings;cfg[e.target.dataset.setting]=e.target.value;setupInfo();}});
$('#date').textContent=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
render();if(warning)toast(warning);


window.visualViewport?.addEventListener('resize',updateStudyViewport);
window.visualViewport?.addEventListener('scroll',updateStudyViewport);
window.addEventListener('resize',updateStudyViewport);
</script>
